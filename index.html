<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tactical Arena - Multiplayer</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui { position: absolute; top: 15px; left: 15px; color: white; pointer-events: none; z-index: 10; font-size: 16px; line-height: 1.5; background: rgba(0,0,0,0.5); padding: 12px 18px; border-radius: 8px; backdrop-filter: blur(4px); }
        .blue-team { color: #60a5fa; font-weight: bold; }
        .red-team { color: #f87171; font-weight: bold; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.9); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; border: 2px solid rgba(0,0,0,0.5); }
        
        #click-to-play { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 15, 0.88); color: white; display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 20; text-align: center; }
        .menu-btn { background: #2563eb; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; margin: 8px; transition: background 0.2s, transform 0.1s; pointer-events: auto; }
        .menu-btn:hover { background: #1d4ed8; transform: translateY(-2px); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script> 
</head>
<body>

<div id="click-to-play">
    <h1 style="margin: 0 0 10px 0; font-size: 36px; letter-spacing: 2px;">TACTICAL ARENA: MULTIPLAYER</h1>
    <div>
        <button class="menu-btn" id="play-here-btn">Join Match</button>
    </div>
    <small style="font-size: 14px; color: #888; margin-top: 20px;">WASD: Move | SPACE: Jump | MOUSE: Look</small>
</div>

<div id="ui">
    <div style="font-size: 18px; margin-bottom: 5px;"><strong>MULTIPLAYER BETA</strong></div>
    Your Team: <span id="teamLabel" style="font-weight: bold;">Connecting...</span><br>
    Players Online: <span id="playerCount">1</span>
</div>
<div id="crosshair"></div>

<script>
    const socket = io();
    const networkPlayers = {}; 
    let myTeam = 'blue';

    // --- UI Elements ---
    const blocker = document.getElementById('click-to-play');
    const playHereBtn = document.getElementById('play-here-btn');
    const teamLabel = document.getElementById('teamLabel');
    const playerCountLabel = document.getElementById('playerCount');

    // --- Procedural Canvas Textures ---
    function createGridTexture(mainColor, gridColor) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = mainColor;
        ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, 256, 256);
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
    }

    const wallTex = createGridTexture('#1e293b', '#334155');
    wallTex.repeat.set(1, 1);
    const floorTex = createGridTexture('#0f172a', '#1e293b');
    floorTex.repeat.set(20, 20);

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);
    scene.fog = new THREE.FogExp2(0x0a0a0f, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Lights ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(30, 50, 30);
    scene.add(dirLight);

    // --- Map Setup (Courtyard) ---
    const walls = [];
    const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.4 });
    const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.8 });

    function createWall(x, z, w, d, h = 6) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
        mesh.position.set(x, h / 2, z);
        scene.add(mesh);
        walls.push({ x, z, w, d });
    }

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    createWall(0, -50, 100, 2); createWall(0, 50, 100, 2);
    createWall(-50, 0, 2, 100); createWall(50, 0, 2, 100);
    createWall(-35, -10, 2, 12); createWall(-35, 10, 2, 12);
    createWall(35, -10, 2, 12); createWall(35, 10, 2, 12);
    createWall(0, 0, 8, 8);
    createWall(-12, -12, 4, 4); createWall(12, -12, 4, 4);
    createWall(-12, 12, 4, 4); createWall(12, 12, 4, 4);
    createWall(-18, -32, 16, 4); createWall(18, -32, 16, 4);
    createWall(-18, 32, 16, 4); createWall(18, 32, 16, 4);

    function checkWallCollision(x, z, radius = 0.8) {
        for (let w of walls) {
            if (x > w.x - w.w / 2 - radius && x < w.x + w.w / 2 + radius &&
                z > w.z - w.d / 2 - radius && z < w.z + w.d / 2 + radius) return true;
        }
        return false;
    }

    // --- Controls ---
    playHereBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
        blocker.style.display = document.pointerLockElement === document.body ? 'none' : 'flex';
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
        }
    });

    const keys = { w: false, a: false, s: false, d: false, space: false };
    window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; if (e.code === 'Space') keys.space = true; });
    window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; if (e.code === 'Space') keys.space = false; });

    // --- Multiplayer Networking ---
    
    function updatePlayerCount() {
        playerCountLabel.innerText = Object.keys(networkPlayers).length + 1; // +1 for ourselves
    }

    function addOtherPlayer(id, info) {
        const geo = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 8);
        const mat = new THREE.MeshStandardMaterial({ color: info.team === 'blue' ? 0x3b82f6 : 0xef4444 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(info.x, info.y - 0.75, info.z);
        scene.add(mesh);
        networkPlayers[id] = { mesh: mesh, team: info.team };
        updatePlayerCount();
    }

    socket.on('currentPlayers', (players) => {
        Object.keys(players).forEach((id) => {
            if (id === socket.id) {
                camera.position.set(players[id].x, players[id].y, players[id].z);
                myTeam = players[id].team;
                teamLabel.innerText = myTeam.toUpperCase();
                teamLabel.style.color = myTeam === 'blue' ? '#60a5fa' : '#f87171';
            } else {
                addOtherPlayer(id, players[id]);
            }
        });
    });

    socket.on('newPlayer', (playerInfo) => addOtherPlayer(playerInfo.id, playerInfo.player));

    socket.on('playerDisconnected', (id) => {
        if (networkPlayers[id]) {
            scene.remove(networkPlayers[id].mesh);
            delete networkPlayers[id];
            updatePlayerCount();
        }
    });

    socket.on('playerMoved', (playerInfo) => {
        if (networkPlayers[playerInfo.id]) {
            networkPlayers[playerInfo.id].mesh.position.set(playerInfo.position.x, playerInfo.position.y - 0.75, playerInfo.position.z);
        }
    });

    // --- Player Movement Loop ---
    let lastPosition = new THREE.Vector3();
    let speed = 0.14;
    let yVel = 0;
    let isGrounded = true;

    function animate() {
        requestAnimationFrame(animate);

        let moveX = 0, moveZ = 0;
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        forward.y = 0; forward.normalize(); right.y = 0; right.normalize();

        if (keys.w) { moveX += forward.x; moveZ += forward.z; }
        if (keys.s) { moveX -= forward.x; moveZ -= forward.z; }
        if (keys.a) { moveX -= right.x; moveZ -= right.z; }
        if (keys.d) { moveX += right.x; moveZ += right.z; }

        if (keys.space && isGrounded) {
            yVel = 0.18;
            isGrounded = false;
        }

        yVel -= 0.0098;
        camera.position.y += yVel;

        if (camera.position.y <= 2) {
            camera.position.y = 2;
            yVel = 0;
            isGrounded = true;
        }

        if (moveX !== 0 || moveZ !== 0) {
            let mag = Math.hypot(moveX, moveZ);
            let dx = (moveX / mag) * speed;
            let dz = (moveZ / mag) * speed;

            if (!checkWallCollision(camera.position.x + dx, camera.position.z)) camera.position.x += dx;
            if (!checkWallCollision(camera.position.x, camera.position.z + dz)) camera.position.z += dz;
        }

        // Emit movement to server if we moved significantly
        if (camera.position.distanceToSquared(lastPosition) > 0.001) {
            socket.emit('playerMovement', { x: camera.position.x, y: camera.position.y, z: camera.position.z });
            lastPosition.copy(camera.position);
        }

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
